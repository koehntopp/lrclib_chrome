<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    * { box-sizing: border-box; }

    html, body { margin: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      width: 480px;
      height: 268px;
      padding: 16px;
      overflow: hidden;
      background-image: url("bg.jpeg");
      background-size: cover;
      background-position: top center;
      color: #fff;
    }

    .row { display: flex; gap: 8px; }

    input[type="text"] {
      flex: 1;
      padding: 9px 12px;
      font-size: 13px;
      border: none;
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.92);
      color: #1a1a1a;
      outline: none;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.25);
      transition: box-shadow 0.15s ease;
    }
    input[type="text"]:focus {
      box-shadow: 0 0 0 2px #4f9dff, 0 2px 6px rgba(0, 0, 0, 0.25);
    }

    button {
      cursor: pointer;
      border: none;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 500;
      transition: transform 0.1s ease, filter 0.15s ease;
    }
    button:hover { filter: brightness(1.08); }
    button:active { transform: scale(0.96); }

    #paste {
      width: 38px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(255, 255, 255, 0.92);
      font-size: 16px;
    }

    #search {
      width: 100%;
      margin-top: 10px;
      padding: 9px;
      background: linear-gradient(135deg, #22c19a, #1aa885);
      color: #fff;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.25);
    }

    .alt-row { display: flex; gap: 8px; margin-top: 10px; }

    .site-btn {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 8px;
      background: rgba(255, 255, 255, 0.14);
      backdrop-filter: blur(4px);
      border: 1px solid rgba(255, 255, 255, 0.25);
    }
    .site-btn img { width: 18px; height: 18px; }

    p#status {
      min-height: 14px;
      margin: 8px 0 0;
      font-size: 12px;
      color: #f4f4f4;
      text-shadow: 0 1px 2px rgba(0, 0, 0, 0.8);
    }
  </style>
</head>
<body>
  <div class="row">
    <input type="text" id="query" placeholder="Suchbegriff">
    <button id="paste" title="Aus Zwischenablage einfügen">📋</button>
  </div>
  <button id="search">Suchen (lrclib.net)</button>
  <div class="alt-row">
    <button class="site-btn" data-site="lrclib" title="lrclib.net">
      <img src="icons/lrclib.png">
    </button>
    <button class="site-btn" data-site="azlyrics" title="azlyrics.com">
      <img src="icons/azlyrics.png">
    </button>
    <button class="site-btn" data-site="genius" title="genius.com">
      <img src="icons/genius.png">
    </button>
    <button class="site-btn" data-site="google" title="Google-Suche">
      <img src="icons/google.png">
    </button>
  </div>
  <p id="status"></p>
  <script src="popup.js"></script>
</body>
</html>
