<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    * { box-sizing: border-box; }

    html, body { margin: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      width: 480px;
      height: 268px;
      padding: 16px;
      overflow: hidden;
      background-image: url("bg.jpeg");
      background-size: cover;
      background-position: top center;
      color: #fff;
    }

    input[type="text"] {
      width: 100%;
      padding: 9px 12px;
      font-size: 13px;
      border: none;
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.92);
      color: #1a1a1a;
      outline: none;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.25);
      transition: box-shadow 0.15s ease;
    }
    input[type="text"]:focus {
      box-shadow: 0 0 0 2px #4f9dff, 0 2px 6px rgba(0, 0, 0, 0.25);
    }

    button {
      cursor: pointer;
      border: none;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 500;
      transition: transform 0.1s ease, filter 0.15s ease;
    }
    button:hover { filter: brightness(1.08); }
    button:active { transform: scale(0.96); }

    .site-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 10px;
    }

    .site-btn {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 9px 12px;
      background: rgba(255, 255, 255, 0.14);
      backdrop-filter: blur(4px);
      border: 1px solid rgba(255, 255, 255, 0.25);
      color: #fff;
    }
    .site-btn img { width: 18px; height: 18px; flex-shrink: 0; }
    .site-btn span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    p#status {
      min-height: 14px;
      margin: 8px 0 0;
      font-size: 12px;
      color: #f4f4f4;
      text-shadow: 0 1px 2px rgba(0, 0, 0, 0.8);
    }
  </style>
</head>
<body>
  <input type="text" id="query" data-i18n-placeholder="searchPlaceholder">
  <div class="site-grid">
    <button class="site-btn" data-site="lrclib">
      <img src="icons/lrclib.png"><span data-i18n="siteLrclibLabel"></span>
    </button>
    <button class="site-btn" data-site="azlyrics">
      <img src="icons/azlyrics.png"><span data-i18n="siteAzlyricsLabel"></span>
    </button>
    <button class="site-btn" data-site="genius">
      <img src="icons/genius.png"><span data-i18n="siteGeniusLabel"></span>
    </button>
    <button class="site-btn" data-site="google">
      <img src="icons/google.png"><span data-i18n="siteGoogleLabel"></span>
    </button>
  </div>
  <p id="status"></p>
  <script src="popup.js"></script>
</body>
</html>
